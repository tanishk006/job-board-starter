
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Board</title>

    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 1000px;
        padding: 16px;
      }

      .container {
        display: grid;
        align-items: start;
        gap: 40px;
        grid-template-columns: 2fr 1fr;
      }

      li {
        border: 1px solid #ddd;
        border-radius: 8px;
        list-style: none;
        margin: 8px 0;
        padding: 12px;
      }

      ul {
        padding: 0;
      }

      input {
        font-size: 16px;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }

      button {
        padding: 7px 12px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.8;
      }

      @media (max-width: 650px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <section>
        <h1>Jobs</h1>

        <input
          id="search"
          placeholder="Search by title, company or place"
        />

        <ul id="jobs"></ul>
      </section>

      <section>
        <h2>Saved Jobs</h2>
        <ul id="saved-jobs"></ul>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
